<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>y2kSearch</title>
  </head>
  <body>
    <div id="app" x-data="apod" x-cloak>
      <div class="main">
        <img class="logo" src="./img/logo.png" alt="logo" />

        <div class="search-container">
          <input
            class="search-input"
            type="text"
            name="search"
            placeholder="Search here..."
          />
          <button class="search-button" type="submit">Search</button>

          <br />

          <div class="types-container">
            <div>
              <input type="radio" name="type" id="all" value="all" checked />
              <label for="all">All</label>
            </div>

            <div>
              <input type="radio" name="type" id="images" value="images" />
              <label for="images">Images</label>
            </div>

            <div>
              <input type="radio" name="type" id="videos" value="videos" />
              <label for="videos">Videos</label>
            </div>

            <div>
              <input type="radio" name="type" id="news" value="news" />
              <label for="news">News</label>
            </div>
          </div>

          <span class="powered-by">
            <em>powered by</em>
            <img src="./img/nasa.svg" alt="NASA" />
          </span>
        </div>
      </div>

      <p x-show="loading">loading...</p>

      <template x-if="error">
        <p x-text="error"></p>
      </template>

      <template x-if="data">
        <article>
          <h1 x-text="data.title"></h1>
          <div class="article-body">
            <img :src="data.url" :alt="data.title" />
            <div class="text">
              <p x-text="data.explanation"></p>
              <p
                class="copyright"
                x-show="data.copyright"
                x-text="data.copyright"
              ></p>
            </div>
          </div>
        </article>
      </template>

      <footer>
        <p style="text-align: center">
          paulo &copy; 2008 - All rights reserved.
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
